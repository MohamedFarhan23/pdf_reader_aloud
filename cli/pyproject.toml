[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-reader-aloud"
version = "0.1.0"
description = "A terminal PDF reader that reads documents aloud with natural, on-device neural voices."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.4"]
piper = ["piper-tts>=1.3"]
audio = ["sounddevice>=0.4"]
all = ["kokoro-onnx>=0.4", "piper-tts>=1.3", "sounddevice>=0.4"]
dev = ["pytest>=7", "reportlab>=4"]

[project.scripts]
pdf-reader-aloud = "pdf_reader_aloud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
